name: Build Tensura 1.0.1
on:
  push:
    branches: [build-1.0.1-fixes]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Skill Totems
        run: python3 tools/prepare_build.py
      - name: Validate JSON and JavaScript
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          roots = [pathlib.Path('behavior_pack'), pathlib.Path('resource_pack')]
          files = list(p for root in roots for p in root.rglob('*.json'))
          errors = []
          for p in files:
              try: json.loads(p.read_text(encoding='utf-8'))
              except Exception as e: errors.append(f'{p}: {e}')
          if errors:
              print('\n'.join(errors)); sys.exit(1)
          print(f'Validated {len(files)} JSON files.')
          PY
          node --check behavior_pack/scripts/main.js
      - name: Package add-on and editable source
        run: |
          mkdir -p dist
          (cd behavior_pack && zip -qr ../dist/Tensura_Behavior.mcpack .)
          (cd resource_pack && zip -qr ../dist/Tensura_Resources.mcpack .)
          (cd dist && zip -q Tensura_Build_01_Core_Races_Progression_R1.0.1.mcaddon Tensura_Behavior.mcpack Tensura_Resources.mcpack)
          zip -qr dist/Tensura_Build_01_R1.0.1_Source.zip . -x '.git/*' 'dist/*'
      - uses: actions/upload-artifact@v4
        with:
          name: Tensura-Build-1.0.1
          path: dist/*
          if-no-files-found: error
